name: validate

# Headless validation. Builds a throwaway project, installs this addon under
# addons/fps_controller, then imports and script-checks it. Adjust godot-version to
# match the Godot you develop against.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Assemble a temp project with the addon
        run: |
          mkdir -p _ci/addons/fps_controller
          rsync -a --exclude '.git' --exclude '_ci' ./ _ci/addons/fps_controller/
          cat > _ci/project.godot <<'PG'
          config_version=5
          [application]
          config/name="ci"
          config/features=PackedStringArray("4.3", "GL Compatibility")
          PG
      - name: Import & headless check
        run: |
          godot --headless --path _ci --import || true
          godot --headless --path _ci --quit-after 5
